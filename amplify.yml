version: 1
backend:
  phases:
    build:
      commands:
        # Gen 2 / ampx require npm (not Bun).
        # Use npm install (not ci): Amplify nested/bundled deps make package-lock
        # fail npm ci on current npm (missing @opentelemetry/core@2.0.0, etc.).
        - npm install --cache .npm --prefer-offline --legacy-peer-deps
        # Lambda-only deps (not part of the Bun frontend)
        - npm install --prefix amplify/functions/translate --legacy-peer-deps
        - CI=1 node scripts/ampx.js pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir src
frontend:
  phases:
    preBuild:
      commands:
        - curl -fsSL https://bun.sh/install | bash
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun install --frozen-lockfile
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun"
        - export PATH="$BUN_INSTALL/bin:$PATH"
        - bun run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
      - ~/.bun/install/cache/**/*
